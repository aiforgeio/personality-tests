<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GBTI 人格测试</title>
  <meta name="description" content="20 道题，扒光你的交易人格。基于公开前端快照还原的 GBTI 静态测试页。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <section id="page-intro" class="page active">
      <div class="card intro-card">
        <div class="intro-eyebrow">GBTI · 股市交易人格测试</div>
        <h1 class="intro-title">20 道题，<br />扒光你的交易人格。</h1>
        <p class="intro-subtitle" id="intro-subtitle"></p>
        <button id="btn-start" class="btn btn-primary">开始测试</button>
        <p class="intro-credit" id="intro-credit"></p>
        <p class="intro-note" id="intro-note"></p>
      </div>
    </section>

    <section id="page-quiz" class="page">
      <div class="card quiz-card">
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-text" id="progress-text">0 / 20</div>
        <div class="question-kicker" id="question-kicker">第 1 题</div>
        <div class="question-area">
          <p class="question-caption" id="question-caption"></p>
          <p class="question-text" id="question-text"></p>
        </div>
        <div class="options" id="options"></div>
      </div>
    </section>

    <section id="page-result" class="page">
      <div class="card result-card">
        <div class="result-kicker">你的交易人格</div>
        <div class="result-name" id="result-name"></div>
        <div class="result-code" id="result-code"></div>
        <div class="result-english" id="result-english"></div>
        <div class="result-badge" id="result-badge"></div>
        <div class="result-intro" id="result-intro"></div>
        <div class="result-desc" id="result-desc"></div>
        <div class="result-note" id="result-note"></div>

        <h3 class="section-title">14 人格得分</h3>
        <div class="score-bars" id="score-bars"></div>

        <div class="result-grid">
          <section class="info-card">
            <h3 class="section-title compact">人格标签</h3>
            <div class="tag-list" id="tag-list"></div>
          </section>
          <section class="info-card">
            <h3 class="section-title compact">你常挂嘴边</h3>
            <div class="quote-list" id="quote-list"></div>
          </section>
        </div>

        <div class="result-grid">
          <section class="info-card">
            <h3 class="section-title compact">你的特征</h3>
            <ul class="bullet-list" id="trait-list"></ul>
          </section>
          <section class="info-card">
            <h3 class="section-title compact">作者建议</h3>
            <ul class="bullet-list" id="advice-list"></ul>
          </section>
        </div>

        <div class="result-top5">
          <h3 class="section-title">最佳匹配 TOP 5</h3>
          <div id="top-list"></div>
        </div>

        <div class="disclaimer" id="disclaimer"></div>

        <div class="result-actions">
          <button id="btn-download" class="btn btn-primary">保存分享图片</button>
          <button id="btn-restart" class="btn btn-secondary">重新测试</button>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
